# Reusable release workflow. A repository calls it from its own release.yml with
# `uses: habemus-papadum/pdum_ship/.github/workflows/release.yml@main`; see README.md.
#
# It runs `ship release` as the repository's CI identity after the commit's CI
# workflow has succeeded. Publishing authenticates with the tokens passed as
# secrets; switching to trusted publishing changes only the publish step.
name: ship release

on:
  # This repository releases itself through the same job; other repositories call it.
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        type: string
        default: habemus-papadum-ship
      bump:
        description: patch, minor or major, applied to the package's last tag
        type: choice
        options: [patch, minor, major]
        default: minor
      dry_run:
        description: Plan and print; write nothing
        type: boolean
        default: true
      skip_tests:
        description: Do not run the test commands before publishing
        type: boolean
        default: false
      ci_workflow:
        description: The CI workflow file that must have succeeded for this commit
        type: string
        default: ci.yml
      skip_ci_check:
        description: Release without waiting for the CI workflow
        type: boolean
        default: false
      uv_version:
        description: uv version to install
        type: string
        default: "0.12.17"
      node_version:
        description: Node version to install when the repository has a pnpm workspace
        type: string
        default: "22"
      pnpm_version:
        description: pnpm version to install when package.json pins none in packageManager
        type: string
        default: "latest"
  workflow_call:
    inputs:
      package:
        description: Package to release (leave empty in a coupled repository)
        type: string
        default: ""
      bump:
        description: patch, minor or major, applied to the package's last tag
        type: string
        default: minor
      dry_run:
        description: Plan and print; write nothing
        type: boolean
        default: true
      skip_tests:
        description: Do not run the test commands before publishing
        type: boolean
        default: false
      ci_workflow:
        description: The CI workflow file that must have succeeded for this commit
        type: string
        default: ci.yml
      skip_ci_check:
        description: Release without waiting for the CI workflow
        type: boolean
        default: false
      uv_version:
        description: uv version to install
        type: string
        default: "0.12.17"
      node_version:
        description: Node version to install when the repository has a pnpm workspace
        type: string
        default: "22"
      pnpm_version:
        description: pnpm version to install when package.json pins none in packageManager
        type: string
        default: "latest"
    secrets:
      PYPI_API_TOKEN:
        required: false
      NPM_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ship-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash   # Includes pipefail: tee must not hide a failed ship command.
    permissions:
      contents: write
      actions: read
      id-token: write   # npm provenance attestations; publishing still authenticates with the token
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ inputs.uv_version }}
          enable-cache: true

      - name: Detect a pnpm workspace
        id: pnpm
        run: |
          # The workspace is the repository root unless [tool.ship] pnpm-root names a subdirectory.
          root=$(python3 -c 'import tomllib; t = tomllib.load(open("pyproject.toml", "rb")); print(t.get("tool", {}).get("ship", {}).get("pnpm-root", "."))')
          echo "root=$root" >> "$GITHUB_OUTPUT"
          if [ -f "$root/pnpm-workspace.yaml" ] || [ -f "$root/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
          # pnpm/action-setup needs a version: from package.json's packageManager when the
          # repository pins one, otherwise from the pnpm_version input.
          if [ -f "$root/package.json" ] && grep -q '"packageManager"' "$root/package.json"; then
            echo "pinned=true" >> "$GITHUB_OUTPUT"
          else
            echo "pinned=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.pnpm.outputs.present == 'true' && steps.pnpm.outputs.pinned == 'true'
        with:
          package_json_file: ${{ steps.pnpm.outputs.root }}/package.json
      - uses: pnpm/action-setup@v4
        if: steps.pnpm.outputs.present == 'true' && steps.pnpm.outputs.pinned == 'false'
        with:
          version: ${{ inputs.pnpm_version }}
      # A repository that pins Node in .nvmrc gets that version; otherwise the input.
      # setup-node writes an .npmrc that reads the publish token from NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v5
        if: steps.pnpm.outputs.present == 'true' && hashFiles('.nvmrc') != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: ${{ steps.pnpm.outputs.root }}/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-node@v5
        if: steps.pnpm.outputs.present == 'true' && hashFiles('.nvmrc') == ''
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm
          cache-dependency-path: ${{ steps.pnpm.outputs.root }}/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Require a successful CI run
        if: ${{ !inputs.skip_ci_check }}
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW: ${{ inputs.ci_workflow }}
        shell: python
        run: |
          import json
          import os
          from pathlib import PurePosixPath
          import subprocess
          import time
          import tomllib


          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()


          def normalized(path, text):
              # Release commits may change only the package's own version, never requirements.
              if PurePosixPath(path).name == "package.json":
                  data = json.loads(text)
                  del data["version"]
              elif PurePosixPath(path).name == "pyproject.toml":
                  data = tomllib.loads(text)
                  del data["project"]["version"]
              elif path == "uv.lock":
                  data = tomllib.loads(text)
                  for package in data.get("package", []):
                      source = package.get("source", {})
                      if "editable" in source or "virtual" in source:
                          package.pop("version", None)
              else:
                  raise ValueError("not a release version file")
              return data


          def only_versions(parent, commit):
              entries = git("diff", "--raw", "--no-renames", "-z", parent, commit).split("\0")
              for header, path in zip(entries[::2], entries[1::2]):
                  old_mode, new_mode, _, _, status = header.split()
                  if old_mode[1:] != new_mode or status != "M":
                      return False
                  try:
                      before = normalized(path, git("show", f"{parent}:{path}"))
                      after = normalized(path, git("show", f"{commit}:{path}"))
                  except (ValueError, KeyError, TypeError):
                      return False
                  if before != after:
                      return False
              return True


          def candidates(head):
              result = [head]
              while True:
                  parents = git("rev-list", "--parents", "-n", "1", result[-1]).split()[1:]
                  if len(parents) != 1 or not only_versions(parents[0], result[-1]):
                      return result
                  result.append(parents[0])


          def choose_run(commits, runs):
              # Prefer the nearest commit's latest run, including pending and failed runs.
              # Never hide a failed current run behind an older successful one.
              for commit in commits:
                  for run in runs:
                      if run["headSha"] == commit and run["event"] in ("push", "workflow_dispatch"):
                          return run
              return None


          def main():
              head = os.environ["SHA"]
              workflow = os.environ["WORKFLOW"]
              commits = candidates(head)
              for attempt in range(60):
                  runs = json.loads(subprocess.check_output([
                      "gh", "run", "list", "--workflow", workflow,
                      "--branch", os.environ["BRANCH"], "--limit", "100",
                      "--json", "headSha,status,conclusion,url,event",
                  ], text=True))
                  run = choose_run(commits, runs)
                  if run and run["status"] == "completed":
                      if run["conclusion"] != "success":
                          raise SystemExit(f"::error::{workflow} concluded {run['conclusion']!r}: {run['url']}")
                      print(f"CI passed for {run['headSha']}: {run['url']}")
                      if run["headSha"] != head:
                          print(f"Reusing CI for {head}: only package version metadata changed.")
                      return
                  print(f"Waiting for {workflow} ({attempt + 1}/60).", flush=True)
                  time.sleep(30)
              raise SystemExit(f"::error::Timed out waiting for {workflow} on {head} or a version-only ancestor.")


          if __name__ == "__main__":
              main()

      - name: Install the repository
        env:
          PNPM_ROOT: ${{ steps.pnpm.outputs.root }}
        run: |
          uv sync --locked
          if [ -f "$PNPM_ROOT/pnpm-lock.yaml" ]; then pnpm -C "$PNPM_ROOT" install --frozen-lockfile; fi

      - name: Check publishing credentials
        if: ${{ !inputs.dry_run }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PNPM_ROOT: ${{ steps.pnpm.outputs.root }}
        run: |
          if [ -f uv.lock ] && [ -z "$PYPI_API_TOKEN" ]; then
            echo "::warning::PYPI_API_TOKEN is not set; a Python publish will fail."
          fi
          if [ -f "$PNPM_ROOT/pnpm-lock.yaml" ] && [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set; an npm publish will fail."
          fi

      - name: Set the git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: ship release
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE: ${{ inputs.package }}
          BUMP: ${{ inputs.bump }}
        run: |
          args=(release --bump "$BUMP")
          if [ -n "$PACKAGE" ]; then args=(release "$PACKAGE" --bump "$BUMP"); fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          if [ "${{ inputs.skip_tests }}" = "true" ]; then args+=(--skip-tests); fi
          uv run --locked ship "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
