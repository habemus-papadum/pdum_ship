# Reusable release workflow. A repository calls it from its own release.yml with
# `uses: habemus-papadum/pdum_ship/.github/workflows/release.yml@main`; see README.md.
#
# It runs `ship release` as the repository's CI identity after the commit's CI
# workflow has succeeded. Publishing authenticates with the tokens passed as
# secrets; switching to trusted publishing changes only the publish step.
name: ship release

on:
  # This repository releases itself through the same job; other repositories call it.
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        type: string
        default: habemus-papadum-ship
      bump:
        description: patch, minor or major, applied to the package's last tag
        type: choice
        options: [patch, minor, major]
        default: minor
      dry_run:
        description: Plan and print; write nothing
        type: boolean
        default: true
      skip_tests:
        description: Do not run the test commands before publishing
        type: boolean
        default: false
      ci_workflow:
        description: The CI workflow file that must have succeeded for this commit
        type: string
        default: ci.yml
      skip_ci_check:
        description: Release without waiting for the CI workflow
        type: boolean
        default: false
      uv_version:
        description: uv version to install
        type: string
        default: "0.12.17"
      node_version:
        description: Node version to install when the repository has a pnpm workspace
        type: string
        default: "22"
      pnpm_version:
        description: pnpm version to install when package.json pins none in packageManager
        type: string
        default: "11"
      setup_pnpm:
        description: Install Node and pnpm for ship's cross-ecosystem tests
        type: boolean
        default: true
      npm_registry:
        description: Registry for npm credentials (publishConfig and scope mappings select packages)
        type: string
        default: https://registry.npmjs.org
      python_registry:
        description: Private Python index URL for native credential setup; empty for public PyPI
        type: string
        default: ""
  workflow_call:
    inputs:
      package:
        description: Package to release (leave empty in a coupled repository)
        type: string
        default: ""
      bump:
        description: patch, minor or major, applied to the package's last tag
        type: string
        default: minor
      dry_run:
        description: Plan and print; write nothing
        type: boolean
        default: true
      skip_tests:
        description: Do not run the test commands before publishing
        type: boolean
        default: false
      ci_workflow:
        description: The CI workflow file that must have succeeded for this commit
        type: string
        default: ci.yml
      skip_ci_check:
        description: Release without waiting for the CI workflow
        type: boolean
        default: false
      uv_version:
        description: uv version to install
        type: string
        default: "0.12.17"
      node_version:
        description: Node version to install when the repository has a pnpm workspace
        type: string
        default: "22"
      pnpm_version:
        description: pnpm version to install when package.json pins none in packageManager
        type: string
        default: "latest"
      setup_pnpm:
        description: Install Node and pnpm even without a pnpm workspace (for tests)
        type: boolean
        default: false
      npm_registry:
        description: Registry for npm credentials (publishConfig and scope mappings select packages)
        type: string
        default: https://registry.npmjs.org
      python_registry:
        description: Private Python index URL for native credential setup; empty for public PyPI
        type: string
        default: ""
    secrets:
      PYPI_API_TOKEN:
        required: false
      NPM_TOKEN:
        required: false
      NPM_BASIC_AUTH:
        description: Optional base64 username:password for a private npm registry, instead of NPM_TOKEN
        required: false
      PYTHON_USERNAME:
        required: false
      PYTHON_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: ship-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash   # Includes pipefail: tee must not hide a failed ship command.
    permissions:
      contents: write
      actions: read
      id-token: write   # npm provenance attestations; publishing still authenticates with the token
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_BASIC_AUTH: ${{ secrets.NPM_BASIC_AUTH }}
      UV_PUBLISH_USERNAME: ${{ secrets.PYTHON_USERNAME }}
      UV_PUBLISH_PASSWORD: ${{ secrets.PYTHON_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ inputs.uv_version }}
          enable-cache: true

      - name: Detect a pnpm workspace
        id: pnpm
        run: |
          # The workspace is the repository root unless [tool.ship] pnpm-root names a subdirectory.
          root=$(python3 -c 'import tomllib; t = tomllib.load(open("pyproject.toml", "rb")); print(t.get("tool", {}).get("ship", {}).get("pnpm-root", "."))')
          echo "root=$root" >> "$GITHUB_OUTPUT"
          if [ -f "$root/pnpm-workspace.yaml" ] || [ -f "$root/package.json" ] || [ "${{ inputs.setup_pnpm }}" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "$root/pnpm-lock.yaml" ]; then echo "locked=true" >> "$GITHUB_OUTPUT"; fi
          # pnpm/action-setup needs a version: from package.json's packageManager when the
          # repository pins one, otherwise from the pnpm_version input.
          if [ -f "$root/package.json" ] && grep -q '"packageManager"' "$root/package.json"; then
            echo "pinned=true" >> "$GITHUB_OUTPUT"
          else
            echo "pinned=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.pnpm.outputs.present == 'true' && steps.pnpm.outputs.pinned == 'true'
        with:
          package_json_file: ${{ steps.pnpm.outputs.root }}/package.json
      - uses: pnpm/action-setup@v4
        if: steps.pnpm.outputs.present == 'true' && steps.pnpm.outputs.pinned == 'false'
        with:
          version: ${{ inputs.pnpm_version }}
      # A repository that pins Node in .nvmrc gets that version; otherwise the input.
      # setup-node writes an .npmrc that reads the publish token from NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v5
        if: steps.pnpm.outputs.present == 'true' && hashFiles('.nvmrc') != ''
        with:
          node-version-file: .nvmrc
          cache: ${{ steps.pnpm.outputs.locked == 'true' && 'pnpm' || '' }}
          cache-dependency-path: ${{ steps.pnpm.outputs.root }}/pnpm-lock.yaml
          registry-url: ${{ inputs.npm_registry }}
      - uses: actions/setup-node@v5
        if: steps.pnpm.outputs.present == 'true' && hashFiles('.nvmrc') == ''
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ steps.pnpm.outputs.locked == 'true' && 'pnpm' || '' }}
          cache-dependency-path: ${{ steps.pnpm.outputs.root }}/pnpm-lock.yaml
          registry-url: ${{ inputs.npm_registry }}

      - name: Configure private registry credentials
        env:
          PYTHON_REGISTRY: ${{ inputs.python_registry }}
          NPM_REGISTRY: ${{ inputs.npm_registry }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          from urllib.parse import urlsplit

          def registry_url(value):
              url = urlsplit(value)
              if url.scheme != "https" or not url.hostname or url.username or url.password or url.query or url.fragment:
                  raise SystemExit("Registry credentials require an HTTPS URL without embedded credentials.")
              return url

          username = os.environ.get("UV_PUBLISH_USERNAME")
          password = os.environ.get("UV_PUBLISH_PASSWORD")
          if username or password:
              if not username or not password or not os.environ.get("PYTHON_REGISTRY"):
                  raise SystemExit("Supply python_registry, PYTHON_USERNAME and PYTHON_PASSWORD together.")
              registry_url(os.environ["PYTHON_REGISTRY"])
              subprocess.run(["uv", "auth", "login", os.environ["PYTHON_REGISTRY"],
                              "--username", username, "--password", "-"], input=password, text=True, check=True)
          # setup-node prepares a trusted auth file. Keep private registry routing
          # in the repository's scope mappings/publishConfig, so public dependencies
          # do not get redirected to a private registry that is not a proxy.
          if os.environ.get("NPM_CONFIG_USERCONFIG") and os.environ["NPM_REGISTRY"].rstrip("/") != "https://registry.npmjs.org":
              registry_url(os.environ["NPM_REGISTRY"])
              path = Path(os.environ["NPM_CONFIG_USERCONFIG"])
              lines = path.read_text().splitlines()
              path.write_text("\n".join(line for line in lines if not (
                  line.partition("=")[0].strip() == "registry" and
                  line.partition("=")[2].strip().rstrip("/") == os.environ["NPM_REGISTRY"].rstrip("/")
              )) + "\n")
          if os.environ.get("NPM_BASIC_AUTH"):
              if os.environ.get("NODE_AUTH_TOKEN"):
                  raise SystemExit("Choose NPM_TOKEN or NPM_BASIC_AUTH, not both.")
              url = registry_url(os.environ["NPM_REGISTRY"])
              key = "//" + url.netloc + url.path.rstrip("/") + "/:_auth"
              with Path(os.environ["NPM_CONFIG_USERCONFIG"]).open("a") as config:
                  config.write("\n" + key + "=${NPM_BASIC_AUTH}\n")

      - name: Check publishing credentials
        if: ${{ !inputs.dry_run }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PNPM_ROOT: ${{ steps.pnpm.outputs.root }}
        run: |
          if [ -f uv.lock ] && [ -z "$PYPI_API_TOKEN" ] && [ -z "$UV_PUBLISH_PASSWORD" ]; then
            echo "::warning::PYPI_API_TOKEN is not set; a Python publish will fail."
          fi
          if [ -f "$PNPM_ROOT/pnpm-lock.yaml" ] && [ -z "$NPM_TOKEN" ] && [ -z "$NPM_BASIC_AUTH" ]; then
            echo "::warning::NPM_TOKEN is not set; an npm publish will fail."
          fi

      - name: Release with ship
        uses: habemus-papadum/pdum_ship/.github/actions/release@main
        with:
          package: ${{ inputs.package }}
          bump: ${{ inputs.bump }}
          dry_run: ${{ inputs.dry_run }}
          skip_tests: ${{ inputs.skip_tests }}
          ci_workflow: ${{ inputs.ci_workflow }}
          skip_ci_check: ${{ inputs.skip_ci_check }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
