[project]
name = "habemus-papadum-ship"
version = "0.3.0"
description = "Release packages and refresh dependencies across uv and pnpm workspaces: one version per package, the tag is the truth, a +dev marker between releases."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Nehal Patel", email = "nehal@alum.mit.edu" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.15",
    "pyyaml>=6.0",
]

[project.scripts]
ship = "pdum.ship.cli:main"

[project.urls]
Repository = "https://github.com/habemus-papadum/pdum_ship"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdum"]

# The plugin skills and the documents they point at travel inside the wheel, so
# `ship skills sync` can write current copies into any repository.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "pdum/ship/_bundled/skills"
"README.md" = "pdum/ship/_bundled/README.md"
"docs/conventions.md" = "pdum/ship/_bundled/docs/conventions.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.13",
]

# ship configures itself with itself. This repository publishes one package.
[tool.ship]
ours = ["habemus-papadum-*", "@habemus-papadum/*"]
shared-paths = [".github/workflows/**"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
